name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, audit, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Фиктивные значения (секретов в CI нет): alembic/env.py читает app.config,
    # conftest.py требует TEST_DATABASE_URL с БД, оканчивающейся на `_test` (guard R29).
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://jobs:jobs@localhost:5432/jobs_test
      BOT_TOKEN: ci-dummy-token
      # Должен совпадать с конфестом (tests/conftest.py): SEC-07 строит «импосторов»
      # из admin_id (admin_id // 10 or 1) — при 1 импостор равен самому админу.
      ADMIN_ID: "1000"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
          # ruff намеренно не входит в requirements-dev (AGENTS.md) — ставится отдельно
          .venv/bin/pip install ruff==0.16.6
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Dependency vulnerability scan (pip-audit, R49)
        run: .venv/bin/pip-audit -r requirements.txt

      - name: Tests (full suite, e2e against PostgreSQL service)
        run: .venv/bin/python -m pytest
